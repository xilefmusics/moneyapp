[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-files = "0.6.10"
actix-governor = "0.10"
actix-web = { version = "4", default-features = true }
anyhow = "1"
async-trait = "0.1.89"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
csv = "1.3"
envy = "0.4.2"
futures-util = "0.3"
hex = "0.4.3"
lettre = { version = "0.11.21", features = ["tokio1-native-tls"] }
oauth2 = { version = "4.4", default-features = false, features = ["reqwest"] }
once_cell = "1"
openidconnect = "3"
rand = { version = "0.8", features = ["std"] }
reqwest = { version = "0.11", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
    "multipart",
] }
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
surrealdb = { version = "3.0.5", default-features = false, features = [
    "kv-mem",
    "protocol-http",
    "protocol-ws",
    "rustls",
] }
surrealdb-types = "3.0.5"
thiserror = "1"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
utoipa = { version = "4", features = ["chrono"] }
utoipa-swagger-ui = { version = "5", features = ["actix-web"] }
uuid = { version = "1", features = ["v4"] }
money_app_shared = { path = "../shared", features = ["backend"] }
