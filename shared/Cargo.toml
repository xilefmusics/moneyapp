[package]
name = "money_app_shared"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = [
    "clock",
    "serde",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.108"
serde_with = { version = "3.4.0", features = ["chrono"] }
thiserror = "1.0"
mime_guess = "2.0.4"
utoipa = { version = "4", optional = true }
uuid = { version = "1.23.0", features = ["v4"], optional = true }

[features]
backend = ["utoipa", "uuid"]
cli = []
frontend = []
